def findBooleanProperty = { Project project, String propertyName, boolean defaultValue ->
    if (!project.hasProperty(propertyName)) {
        return defaultValue
    }

    return project.findProperty(propertyName).toString().toBoolean()
}

def standardInputReader = new BufferedReader(new InputStreamReader(System.in))

def promptBoolean = { String prompt, boolean defaultValue ->
    String suffix = defaultValue ? '[Y/n]' : '[y/N]'
    String fullPrompt = "${prompt} ${suffix}: "
    String answer

    if (System.console() != null) {
        answer = System.console().readLine(fullPrompt)
    } else {
        print fullPrompt
        System.out.flush()
        answer = standardInputReader.readLine()
    }

    if (answer == null || answer.trim().isEmpty()) {
        return defaultValue
    }

    return answer.trim().equalsIgnoreCase('y') || answer.trim().equalsIgnoreCase('yes')
}

def findInstallChoice = { Project project, String propertyName, String prompt, boolean defaultValue ->
    if (project.hasProperty(propertyName)) {
        return project.findProperty(propertyName).toString().toBoolean()
    }

    if (findBooleanProperty(project, interactiveInstallPropertyName, true)) {
        return promptBoolean(prompt, defaultValue)
    }

    return defaultValue
}

def findLocalInstallerRoot = {
    File initScript = gradle.startParameter.allInitScripts.find { script ->
        script.name == 'install.gradle' || script.name == '.robot-library-install.gradle'
    }

    if (initScript == null) {
        return null
    }

    return initScript.parentFile
}

def findLocalTemplateRoot = {
    File installerRoot = findLocalInstallerRoot()
    if (installerRoot == null) {
        return null
    }

    File templateRoot = new File(installerRoot, 'templates')
    return templateRoot.exists() ? templateRoot : null
}

def deleteDirectory = { File directory ->
    if (!directory.exists()) {
        return
    }

    Files.walk(directory.toPath())
        .sorted(Comparator.reverseOrder())
        .forEach { path -> Files.deleteIfExists(path) }
}

def copyDirectory = { File source, File destination ->
    deleteDirectory(destination)
    Files.walk(source.toPath()).forEach { sourcePath ->
        File target = destination.toPath().resolve(source.toPath().relativize(sourcePath)).toFile()
        if (Files.isDirectory(sourcePath)) {
            target.mkdirs()
        } else {
            target.parentFile.mkdirs()
            Files.copy(sourcePath, target.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.COPY_ATTRIBUTES)
        }
    }
}

def unzip = { File zipFile, File destination ->
    deleteDirectory(destination)
    destination.mkdirs()

    zipFile.withInputStream { input ->
        ZipInputStream zip = new ZipInputStream(input)
        def entry
        while ((entry = zip.nextEntry) != null) {
            File target = new File(destination, entry.name)
            if (!target.canonicalPath.startsWith(destination.canonicalPath + File.separator)) {
                throw new GradleException("Refusing to unzip suspicious entry ${entry.name}")
            }

            if (entry.directory) {
                target.mkdirs()
            } else {
                target.parentFile.mkdirs()
                target.withOutputStream { output -> output << zip }
            }
            zip.closeEntry()
        }
        zip.close()
    }
}

def runCommand = { File workingDirectory, List<String> command ->
    Process process = new ProcessBuilder(command)
        .directory(workingDirectory)
        .redirectErrorStream(true)
        .start()

    process.inputStream.eachLine { line -> logger.lifecycle(line) }
    int exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Command failed (${exitCode}): ${command.join(' ')}")
    }
}

def runRobotBuild = { Project project ->
    boolean isWindowsHost = System.getProperty('os.name').toLowerCase().contains('windows')
    File gradleWrapper = project.file(isWindowsHost ? 'gradlew.bat' : 'gradlew')
    if (!gradleWrapper.exists()) {
        logger.lifecycle('Skipped build because no Gradle wrapper was found.')
        return
    }

    logger.lifecycle('Running fresh robot build after install...')
    runCommand(project.rootDir, [
        gradleWrapper.absolutePath,
        '--no-daemon',
        '--console=plain',
        'build'
    ])
}


def backupExistingFile = { File destination ->
    if (!destination.exists()) {
        return null
    }

    File backup = new File(destination.parentFile, "${destination.name}.powerlib.bak")
    int index = 1
    while (backup.exists()) {
        backup = new File(destination.parentFile, "${destination.name}.powerlib.bak.${index}")
        index++
    }

    Files.copy(destination.toPath(), backup.toPath(), StandardCopyOption.COPY_ATTRIBUTES)
    return backup
}

def copyTemplateFile = { Project project, TemplateFile template ->
    File destination = project.file(template.destination)
    destination.parentFile.mkdirs()

    File backup = null
    if (template.replacement) {
        backup = backupExistingFile(destination)
    }

    File localTemplateRoot = findLocalTemplateRoot()
    File localTemplate = localTemplateRoot == null ? null : new File(localTemplateRoot, template.source)

    if (localTemplate != null && localTemplate.exists()) {
        Files.copy(localTemplate.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
    } else {
        URL templateUrl = new URL("${rawBaseUrl}/${template.source}")
        destination.text = templateUrl.getText('UTF-8')
    }

    return backup
}


def installGeneratorScript = { Project project ->
    File scriptsDirectory = project.file('power-tool/scripts')
    scriptsDirectory.mkdirs()

    File generatorScript = new File(scriptsDirectory, 'generate-subsystem.ps1')
    File localInstallerRoot = findLocalInstallerRoot()
    File localGeneratorScript = localInstallerRoot == null ? null : new File(localInstallerRoot, 'generate-subsystem.ps1')
    if (localGeneratorScript != null && localGeneratorScript.exists()) {
        Files.copy(localGeneratorScript.toPath(), generatorScript.toPath(), StandardCopyOption.REPLACE_EXISTING)
    } else {
        generatorScript.text = new URL(generatorScriptUrl).getText('UTF-8')
    }

    File generateCommand = new File(scriptsDirectory, 'powerlib-generate-subsystem.cmd')
    generateCommand.text = '''@echo off
powershell -ExecutionPolicy Bypass -File "%~dp0generate-subsystem.ps1" %*
'''

    File updateCommand = new File(scriptsDirectory, 'powerlib-update-subsystems.cmd')
    updateCommand.text = '''@echo off
powershell -ExecutionPolicy Bypass -File "%~dp0generate-subsystem.ps1" -UpdateSubsystems %*
'''

    File oldGeneratorScript = project.file('.robot-library-generate-subsystem.gradle')
    if (oldGeneratorScript.exists() && !oldGeneratorScript.delete()) {
        logger.warn("Could not remove old subsystem generator script: ${oldGeneratorScript.name}")
    }
    [
        project.file('.robot-library-generate-subsystem.ps1'),
        project.file('powerlib-generate-subsystem.cmd'),
        project.file('powerlib-update-subsystems.cmd'),
        project.file('powerlib-dashboard.ps1'),
        project.file('power-tool.ps1'),
        project.file('powerlib-dashboard.cmd')
    ].each { oldScript ->
        if (oldScript.exists() && !oldScript.delete()) {
            logger.warn("Could not remove old helper script: ${oldScript.name}")
        }
    }

    logger.lifecycle("Installed subsystem generator script: ${project.relativePath(generatorScript)}")
    logger.lifecycle("Installed subsystem generator command: ${project.relativePath(generateCommand)}")
    logger.lifecycle("Installed subsystem update command: ${project.relativePath(updateCommand)}")
}

def deleteOldDashboardBuildScript = { Project project ->
    File oldDashboardBuildScript = project.file('powerlib-build-dashboard.ps1')
    if (oldDashboardBuildScript.exists() && !oldDashboardBuildScript.delete()) {
        logger.warn("Could not remove old dashboard build script: ${oldDashboardBuildScript.name}")
    }
}

def installDashboardTools = { Project project ->
    File dashboardInstallScript = project.file("build/${dashboardInstallScriptName}")
    try {
        dashboardInstallScript.parentFile.mkdirs()

        File localInstallerRoot = findLocalInstallerRoot()
        File localDashboardInstallScript = localInstallerRoot == null ? null : new File(localInstallerRoot, 'build-dashboard-install.ps1')
        if (localDashboardInstallScript != null && localDashboardInstallScript.exists()) {
            Files.copy(localDashboardInstallScript.toPath(), dashboardInstallScript.toPath(), StandardCopyOption.REPLACE_EXISTING)
        } else {
            dashboardInstallScript.text = new URL(dashboardBuildScriptUrl).getText('UTF-8')
        }

        runCommand(project.rootDir, [
            'powershell',
            '-ExecutionPolicy',
            'Bypass',
            '-File',
            dashboardInstallScript.absolutePath
        ])
    } catch (Exception exception) {
        logger.warn("Skipped Power Tool install: ${exception.message}")
    } finally {
        if (dashboardInstallScript.exists() && !dashboardInstallScript.delete()) {
            dashboardInstallScript.deleteOnExit()
        }

        deleteOldDashboardBuildScript(project)
    }
}

def parseJsonFile = { File file ->
    try {
        return new JsonSlurper().parse(file)
    } catch (Exception ignored) {
        return null
    }
}

def readVendordepJson = { VendorDependency dependency, boolean usePinnedVersion ->
    File localTemplateRoot = findLocalTemplateRoot()
    File localVendordep = usePinnedVersion && dependency.pinnedSource != null && localTemplateRoot != null
        ? new File(localTemplateRoot, dependency.pinnedSource)
        : null

    if (localVendordep != null && localVendordep.exists()) {
        return localVendordep.getText('UTF-8')
    }

    if (usePinnedVersion && dependency.pinnedSource != null) {
        return new URL("${rawBaseUrl}/${dependency.pinnedSource}").getText('UTF-8')
    }

    return new URL(dependency.url).getText('UTF-8')
}

def installVendorDependency = { Project project, VendorDependency dependency, boolean usePinnedVersion ->
    File vendorDepsDir = project.file('vendordeps')
    vendorDepsDir.mkdirs()

    String jsonText = readVendordepJson(dependency, usePinnedVersion)
    def json = new JsonSlurper().parseText(jsonText)
    String fallbackName = usePinnedVersion ? dependency.pinnedSource : dependency.url
    String fileName = json.fileName ?: fallbackName.tokenize('/').last()
    File destination = new File(vendorDepsDir, fileName)

    vendorDepsDir.listFiles({ File file -> file.name.endsWith('.json') } as FileFilter)?.each { existing ->
        if (existing.name != destination.name) {
            def existingJson = parseJsonFile(existing)
            boolean sameVendor = existingJson != null && ((json.uuid && existingJson.uuid == json.uuid) || (json.name && existingJson.name == json.name))
            if (sameVendor && !existing.delete()) {
                logger.warn("Could not remove old vendordep ${existing}")
            }
        }
    }

    destination.text = jsonText
    String sourceLabel = usePinnedVersion ? 'pinned' : 'latest'
    logger.lifecycle("Installed ${dependency.label} ${sourceLabel} vendordep: ${destination.name}")
}

gradle.projectsLoaded {
    rootProject {
        tasks.register('robotLibraryInstall') {
            group = 'robot library'
            description = 'Installs Team 9410 PowerLib starter files into this robot project.'

            doLast {
                List<File> backups = []
                boolean keepBackups = findBooleanProperty(project, keepBackupsPropertyName, false)
                boolean useLatestVendordeps = findBooleanProperty(project, latestVendordepsPropertyName, false)
                boolean installLib = findInstallChoice(project, installLibPropertyName, 'Install PowerLib Java/starter files?', true)
                boolean installScripts = findInstallChoice(project, installScriptsPropertyName, 'Install helper scripts?', true)
                boolean installVendordeps = findInstallChoice(project, installVendordepsPropertyName, 'Install vendor dependencies?', true)
                boolean installTools = findBooleanProperty(project, installToolsPropertyName, true)
                boolean installDashboard = installTools && findInstallChoice(project, installDashboardPropertyName, 'Download Power Tool source and run npm install?', true)
                boolean vendordepsOnly = installVendordeps && !installLib && !installDashboard && !installScripts

                logger.lifecycle('PowerLib install selections:')
                logger.lifecycle("  Java/starter files: ${installLib}")
                logger.lifecycle("  Helper scripts: ${installScripts}")
                logger.lifecycle("  Vendor dependencies: ${installVendordeps}")
                logger.lifecycle("  Power Tool: ${installDashboard}")

                if (installVendordeps) {
                    vendorDependencies.each { dependency ->
                        installVendorDependency(project, dependency, false)
                    }
                    if (!useLatestVendordeps) {
                        vendorDependencies.findAll { dependency -> dependency.pinnedSource != null }.each { dependency ->
                            installVendorDependency(project, dependency, true)
                        }
                    }
                    if (vendordepsOnly) {
                        logger.lifecycle('Vendor dependency install complete. Waiting 5 seconds...')
                        Thread.sleep(5000)
                    }
                } else {
                    logger.lifecycle('Skipped vendordeps')
                }

                if (installLib) {
                    templateFiles.each { template ->
                        File backup = copyTemplateFile(project, template)
                        if (backup != null) {
                            backups.add(backup)
                        }
                    }
                } else {
                    logger.lifecycle('Skipped PowerLib files')
                }

                if (installDashboard) {
                    installDashboardTools(project)
                } else {
                    logger.lifecycle(installTools ? 'Skipped Power Tool' : 'Skipped PowerLib tools')
                    deleteOldDashboardBuildScript(project)
                }

                if (installScripts) {
                    installGeneratorScript(project)
                } else {
                    logger.lifecycle('Skipped helper scripts')
                }

                if (keepBackups) {
                    backups.each { backup ->
                        logger.lifecycle("Kept backup ${backup}")
                    }
                } else {
                    backups.each { backup ->
                        if (backup.exists() && !backup.delete()) {
                            logger.warn("Could not delete temporary backup ${backup}")
                        }
                    }
                }


                logger.lifecycle('PowerLib install complete')

                if (!findBooleanProperty(project, skipBuildPropertyName, false)) {
                    runRobotBuild(project)
                }
            }
        }
    }
}

gradle.buildFinished {
    File downloadedInstaller = gradle.rootProject.file('.robot-library-install.gradle')
    if (!downloadedInstaller.exists()) {
        return
    }

    if (downloadedInstaller.delete()) {
        return
    }

    downloadedInstaller.deleteOnExit()

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        [
            'cmd', '/c',
            'start', '', '/min', 'cmd', '/c',
            "ping 127.0.0.1 -n 3 > nul && del /f /q \"${downloadedInstaller.absolutePath}\""
        ].execute()
    } else {
        ['sh', '-c', "sleep 2; rm -f '${downloadedInstaller.absolutePath.replace("'", "'\\''")}'"].execute()
    }
}













